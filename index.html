<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f97316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Connectus - Flashcards</title>
<style>
  :root{--accent:#f97316;--accent-2:#ea580c;--bg:#f7f4f1;--panel:#fff;--ink:#20160f;--muted:#7a6a5d;--line:#ecdfd3}
  body.dark{--bg:#0c0b0a;--panel:#161412;--ink:#f6efe9;--muted:#a99a8d;--line:#2b2622}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;
        box-shadow:0 24px 60px -30px rgba(120,60,10,.5);padding:22px;text-align:center}
  .brand{font-size:1.4rem;font-weight:900;letter-spacing:-.025em;margin:0 0 4px}
  .q{color:var(--muted);font-size:.85rem;margin:0 0 16px}
  .spin{width:30px;height:30px;margin:6px auto 14px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent-2);animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  button{width:100%;padding:13px;border-radius:999px;border:0;background:var(--accent-2);color:#fff;font:inherit;font-weight:800;cursor:pointer}
  button:active{transform:translateY(1px)}
  .err{color:var(--muted);font-size:.85rem;line-height:1.5;margin:0 0 14px}
  .tiny{color:var(--muted);font-size:.7rem;margin-top:12px;opacity:.75}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin" id="spin"></div>
  <h1 class="brand">Connectus</h1>
  <p class="q" id="msg">Starting…</p>
  <p class="err" id="err" style="display:none"></p>
  <button id="retry" style="display:none">Try again</button>
  <div class="tiny" id="tiny"></div>
</div>
<script>
/* Connectus loader. Rules it must never break:
   1. Never spin forever — every network call has a timeout.
   2. Paint the last good build instantly if we have one.
   3. Check for a newer build in the background; swap only if the user has not started.
   4. On failure, always offer a way forward (Try again), never a dead end. */
(function(){
  var SB = "https://vcsfjzlelpwditxdbaea.supabase.co";
  var KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZjc2ZqemxlbHB3ZGl0eGRiYWVhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NTg2NTEsImV4cCI6MjEwNzAzNDY1MX0.Sx9wB-78a4DEfdA67kSZpAA2qIIkxPBSH84chU_0RPc";
  var FN = SB + "/functions/v1/medcircuit";
  var CACHE = "fd:appcache", TIMEOUT = 20000;
  var spin = document.getElementById("spin"), err = document.getElementById("err");
  var retry = document.getElementById("retry"), msg = document.getElementById("msg"), tiny = document.getElementById("tiny");
  var started = Date.now(), rendered = false, trying = false;

  /* Installable + offline. This must run BEFORE we document.write() the app,
     because that replaces this document and takes our listeners with it.
     The worker only ever touches same-origin shell files — never Supabase,
     never the edge function — so it can never serve stale data. */
  try{
    if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  }catch(e){}
  try{ if(localStorage.getItem("fd:theme") === "dark") document.body.classList.add("dark"); }catch(e){}

  function ok(h){ return h && h.indexOf('id="content"') >= 0 && h.indexOf("collapseFab") >= 0 && h.indexOf("</html>") >= 0; }
  function buildOf(h){ var m = String(h).match(/var APP_BUILD = '([^']+)'/); return m ? m[1] : ""; }
  function show(h){
    rendered = true;
    try{ sessionStorage.setItem("fd:selfupdate", buildOf(h)); }catch(e){}
    var wrote = false;
    /* document.write() called from an inline script APPENDS to the body - it does
       NOT replace the page. So the "Opening…" card stayed on top of the app for
       ever, over a stale snapshot, with no way out: exactly what was reported.
       Set the markup directly instead, then re-run the app's scripts, because
       innerHTML inserts <script> elements inert. */
    try{
      document.documentElement.innerHTML = h;
      Array.prototype.forEach.call(document.querySelectorAll('script'), function(o){
        if(o.getAttribute('data-fd-live')) return;
        var sc = document.createElement('script');
        sc.setAttribute('data-fd-live', '1');
        if(o.src){ sc.src = o.src; } else { sc.textContent = o.textContent; }
        (document.body || document.documentElement).appendChild(sc);
      });
      wrote = true;
    }catch(e){}
    /* Watchdog. document.write() is how we hand over to the app, but a browser
       may silently refuse it (a restored PWA, a background tab, a memory-short
       device) - and then this card sits on "Opening…" for ever, over a stale
       snapshot of the app, with no way out. So: shortly after the handover,
       check that the app is really there. If it is not, stop pretending and
       offer the way forward. */
    setTimeout(function(){
      try{
        if(document.getElementById('content')) return;      /* the app took over - done */
        if(!document.getElementById('card')) return;        /* not our page any more - leave it */
        if(!wrote){
          /* the handover was refused: try the direct route once more */
          try{
            document.documentElement.innerHTML = h;
            Array.prototype.forEach.call(document.querySelectorAll('script'), function(o){
              if(o.getAttribute('data-fd-live')) return;
              var sc = document.createElement('script'); sc.setAttribute('data-fd-live', '1');
              if(o.src){ sc.src = o.src; } else { sc.textContent = o.textContent; }
              (document.body || document.documentElement).appendChild(sc);
            });
            return;
          }catch(e){}
        }
        stuck();                                            /* say it plainly, and offer Try again */
      }catch(e){}
    }, 4000);
  }
  function getCached(){ try{ var c = localStorage.getItem(CACHE); return (c && ok(c)) ? c : null; }catch(e){ return null; } }
  function put(h){ try{ localStorage.setItem(CACHE, h); }catch(e){ /* quota / private mode */ } }

  /* fetch with a hard timeout — the whole point: never hang */
  function pull(){
    var ctl = null;
    try{ ctl = new AbortController(); }catch(e){ ctl = null; }
    var timer = setTimeout(function(){ try{ if(ctl) ctl.abort(); }catch(e){} }, TIMEOUT);
    return fetch(FN + "?_=" + Date.now(), { headers: { "apikey": KEY }, cache: "no-store", signal: ctl ? ctl.signal : undefined })
      .then(function(r){ clearTimeout(timer); if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
      .catch(function(e){ clearTimeout(timer); throw e; });
  }

  function fail(soft){
    /* soft = we already painted a cached build, so say nothing loud */
    if(soft || rendered){ tiny.textContent = "Showing the last saved copy — will retry when online."; return; }
    spin.style.display = "none";
    msg.style.display = "none";
    err.style.display = "block";
    err.textContent = "Could not load the app. Check your connection and tap Try again.";
    retry.style.display = "block";
  }

  /* The card is still on screen, so this page is still ours: say it plainly and
     give a real way out. `fail()` cannot be used here - it goes quiet once we
     have "rendered", which is exactly the trap we are escaping. */
  function stuck(){
    try{
      spin.style.display = "none";
      msg.style.display = "none";
      err.style.display = "block";
      err.textContent = "Could not open the app. Check your connection and tap Try again.";
      retry.style.display = "block";
    }catch(e){}
  }

  function refresh(){
    if(trying) return;
    trying = true;
    var have = getCached();
    /* Data guard: ask the 16-byte version question FIRST. Only download the
       ~450 KB app when the build actually changed (or we have nothing cached). */
    fetch(FN + "?api=version&_=" + Date.now(), { headers: { "apikey": KEY }, cache: "no-store" })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        var latest = v && v.ui_version ? String(v.ui_version) : "";
        if(have && latest && buildOf(have) === latest){
          trying = false;
          tiny.textContent = "Up to date.";
          setTimeout(function(){ tiny.textContent = ""; }, 1500);
          return;
        }
        pull().then(function(html){
      trying = false;
      if(!ok(html)) throw new Error("bad build");
      var old = getCached();
      put(html);
      if(!old){ show(html); return; }
      /* Swap whenever the build actually changed. This used to also require
         `Date.now() - started < 6000` - so a download that took longer than six
         seconds was silently dropped, the loader said "Up to date.", and the
         device stayed on the old build for ever. On mobile data a 470 KB app
         routinely takes longer than six seconds. */
      if(buildOf(html) !== buildOf(old)){ show(html); }
      else { tiny.textContent = "Up to date."; setTimeout(function(){ tiny.textContent = ""; }, 1500); }
    }).catch(function(){ trying = false; fail(!!getCached()); });
      })
      .catch(function(){ /* version check failed: fall back to the old behaviour */
        pull().then(function(html){
          if(!ok(html)) throw new Error("bad build");
          var old2 = getCached(); put(html);
          if(!old2){ show(html); return; }
          if(buildOf(html) !== buildOf(old2)) show(html);   /* same fix as above */
        }).catch(function(){ trying = false; fail(!!getCached()); });
      });
  }

  var c0 = getCached();
  if(c0){ msg.textContent = "Opening…"; show(c0); refresh(); }
  else { msg.textContent = "Loading the latest version…"; refresh(); }

  /* Last line of defence: whatever happened, this page must not be a dead end.
     If we are still the loader nine seconds in, the user gets a real button. */
  setTimeout(function(){
    try{
      if(document.getElementById('card')) stuck();
    }catch(e){}
  }, 9000);

  retry.onclick = function(){
    err.style.display = "none"; retry.style.display = "none"; spin.style.display = "block"; msg.style.display = "block";
    msg.textContent = "Retrying…"; refresh();
  };
  /* if the tab comes back and we never painted, try again */
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && !rendered) refresh(); });
})();
</script>
</body>
</html>
