<!DOCTYPE html>
<html lang="en">
<head>
<!-- Flashcard Daily deck template — v3.0. Self-contained + built-in cloud sync. Do not redesign per deck. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TOPIC}} — Flashcards</title>
<style>
  :root{
    --accent:#f97316; --accent-2:#ea580c; --accent-soft:#fff1e6;
    --bg:#ffffff; --panel:#ffffff; --ink:#20160f; --muted:#7a6a5d; --line:#f0e2d6;
    --good:#1d4ed8; --easy:#0f766e; --hard:#b45309; --again:#c81e1e;
    --radius:22px; --cap:999px;
  }
  body.dark{
    --accent:#fb923c; --accent-2:#f97316; --accent-soft:#2a1a0e;
    --bg:#000000; --panel:#141210; --ink:#f6efe9; --muted:#a99a8d; --line:#2b2622;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
    transition:background .2s, color .2s;
  }
  button{font:inherit; color:inherit; cursor:pointer}
  .hidden{display:none!important}

  /* ---- banner ---- */
  .banner{padding:12px 16px 10px; background:var(--panel); border-bottom:1px solid var(--line);
    position:relative; z-index:6; padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .head-top{display:flex; align-items:center; gap:10px}
  .topic{font-size:1.1rem; font-weight:750; letter-spacing:-.01em; line-height:1.2; flex:1; min-width:0}
  .capsule{border:1px solid var(--line); background:var(--panel); border-radius:var(--cap); padding:7px 13px; font-size:.82rem; font-weight:600}
  .shuffle-row{display:flex; justify-content:center; gap:8px; margin-top:8px}
  .tagbar{display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-top:8px}
  .tchip{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:var(--cap); padding:5px 11px; font-size:.72rem; font-weight:700}
  .tchip.on{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
  .cardtag{position:absolute; top:14px; right:16px; font-size:.66rem; font-weight:800; letter-spacing:.02em; padding:4px 10px; border-radius:var(--cap); color:var(--accent-2); background:var(--accent-soft)}
  .back .cardtag{color:#fff; background:var(--accent-2)}
  .icon-btn{width:38px; height:38px; border-radius:var(--cap); border:1px solid var(--line); background:var(--panel); font-size:1rem; display:flex; align-items:center; justify-content:center}
  .meta{color:var(--muted); font-size:.78rem; margin-top:6px; text-align:center}
  .meta .due{color:var(--accent-2); font-weight:700}
  .bar{height:4px; background:var(--line); border-radius:var(--cap); margin-top:8px; overflow:hidden}
  .bar>i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .25s ease}

  /* ---- layout ---- */
  main{flex:1; min-height:0; display:grid; grid-template-columns:1fr;
    grid-template-rows:1fr auto auto auto;
    grid-template-areas:"scene" "controls" "rate" "intervals";
    gap:8px; padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
  .scene{grid-area:scene; min-height:0; display:flex; align-items:center; justify-content:center}
  .controls{grid-area:controls; display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
  .rate{grid-area:rate; display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .intervals{grid-area:intervals; display:flex; gap:8px; justify-content:center; flex-wrap:wrap}

  .card{position:relative; width:100%; max-width:680px; height:100%; cursor:pointer}
  .face{position:absolute; inset:0; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:34px 24px 24px; display:flex; flex-direction:column; justify-content:center;
    box-shadow:0 22px 48px -20px rgba(120,60,10,.34), 0 6px 16px -8px rgba(120,60,10,.18);
    -webkit-backface-visibility:hidden; backface-visibility:hidden; overflow:hidden}
  .inner{max-height:100%; overflow:auto}
  .card:not(.flipped) .back{display:none}
  .card.flipped .front{display:none}
  .card.flipped .back{animation:flipin .34s ease}
  .card:not(.flipped) .front{animation:flipin .34s ease}
  @keyframes flipin{from{transform:rotateY(68deg); opacity:.3} to{transform:rotateY(0); opacity:1}}
  .tag{position:absolute; top:14px; left:18px; font-size:.68rem; font-weight:700; letter-spacing:.1em;
    text-transform:uppercase; padding:4px 11px; border-radius:var(--cap)}
  .front .tag{color:var(--accent-2); background:var(--accent-soft)}
  .back .tag{color:#fff; background:var(--accent-2)}
  .lead{font-size:1.34rem; line-height:1.45; font-weight:700; letter-spacing:-.01em; margin:0}
  .back .lead{font-weight:600}
  .pts{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
  .pts>li{position:relative; padding-left:24px; font-size:1.08rem; line-height:1.4; font-weight:550}
  .pts>li::before{content:""; position:absolute; left:1px; top:.52em; width:8px; height:8px; border-radius:50%; background:var(--accent-2)}
  .pts .sub{list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px}
  .pts .sub li{position:relative; padding-left:16px; font-size:.96rem; line-height:1.38; font-weight:450; color:var(--muted)}
  .pts .sub li::before{content:""; position:absolute; left:1px; top:.72em; width:9px; height:2px; border-radius:2px; background:var(--muted); opacity:.6}
  .blank{display:inline-block; min-width:4ch; height:1.02em; vertical-align:-.13em;
    background:var(--accent-soft); border-bottom:2px solid var(--accent-2); border-radius:5px}
  .hl{background:var(--accent-soft); color:var(--accent-2); font-weight:800; border-radius:5px; padding:0 .26em}
  .occwrap{display:flex; flex-direction:column; gap:12px; align-items:center}
  .occ{position:relative; display:inline-block; max-width:100%}
  .occ img{display:block; max-width:100%; height:auto; border-radius:14px; border:1px solid var(--line)}
  .occbox{position:absolute; border-radius:6px; background:var(--accent-2); color:#fff; font-size:.7rem;
    font-weight:700; display:flex; align-items:center; justify-content:center; padding:2px; overflow:hidden}
  .occbox.revealed{background:var(--accent-soft); color:var(--accent-2); border:1px solid var(--accent-2)}
  .src{margin-top:16px; font-size:.75rem; color:var(--muted); font-weight:500}
  /* owner-only fixed-id chip (the card's cid), shown beside the source line */
  .idchip{display:inline-block; margin-left:8px; padding:1px 7px; border:1px solid var(--line); border-radius:999px; font-size:.66rem; font-weight:700; letter-spacing:.05em; color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; vertical-align:middle}
  .note{margin-top:12px; padding:10px 12px; border-left:3px solid var(--accent-2); background:var(--accent-soft);
    border-radius:8px; font-size:.85rem; line-height:1.4}
  .note b{color:var(--accent-2)}

  /* buttons */
  .btn{border:1px solid var(--line); background:var(--panel); border-radius:var(--cap); padding:11px 18px; font-size:.9rem; font-weight:600; box-shadow:0 2px 6px -3px rgba(120,60,10,.3)}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
  .btn.on{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
  .btn:disabled{opacity:.4; cursor:default; box-shadow:none}
  .rate .btn{display:flex; flex-direction:column; align-items:center; gap:1px; padding:9px 15px; line-height:1.1}
  .rate .btn small{font-size:.66rem; font-weight:600; opacity:.75}
  .rate .btn[data-r="0"].on{background:var(--again); border-color:var(--again)}
  .rate .btn[data-r="1"].on{background:var(--hard); border-color:var(--hard)}
  .rate .btn[data-r="2"].on{background:var(--good); border-color:var(--good)}
  .rate .btn[data-r="3"].on{background:var(--easy); border-color:var(--easy)}
  .intervals .btn{padding:9px 14px; font-size:.85rem}
  .intervals .btn.on{background:var(--accent-2); border-color:var(--accent-2); color:#fff}
  .ivlabel{font-size:.75rem; color:var(--muted); align-self:center; margin-right:2px}

  /* fixed edit */
  #editBtn{position:fixed; left:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:8}

  /* drawer */
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .22s; z-index:30}
  .backdrop.open{opacity:1; pointer-events:auto}
  .drawer{position:fixed; top:0; right:0; height:100%; width:min(300px,84vw); background:var(--panel);
    transform:translateX(105%); transition:transform .24s ease; z-index:31; display:flex; flex-direction:column;
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); gap:10px; overflow:auto;
    border-left:1px solid var(--line)}
  .drawer.open{transform:none}
  .drawer-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px}
  .drawer-head span{font-weight:750; font-size:1rem}
  .drawer .btn{width:100%; text-align:left; padding:13px 16px}

  /* cards sheet */
  .sheet{position:fixed; inset:0; background:var(--bg); z-index:32; display:flex; flex-direction:column;
    padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; padding:4px 16px 8px}
  .sheet-head span{font-weight:750}
  .sheet .list{flex:1; overflow:auto; padding:4px 14px 96px; display:flex; flex-direction:column; gap:8px}
  .cardrow{border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:12px 14px;
    text-align:left; font-size:.9rem; line-height:1.35; display:flex; gap:10px; align-items:flex-start}
  .cardrow .n{color:var(--muted); font-weight:700; min-width:1.6em}
  .cardrow .dotmark{width:9px; height:9px; border-radius:50%; margin-top:.45em; flex:none}
  .searchwrap{position:absolute; left:14px; right:14px; bottom:calc(14px + env(safe-area-inset-bottom,0px)); z-index:2}
  .search{width:100%; border-radius:var(--cap); border:1px solid var(--line); background:var(--panel);
    color:var(--ink); padding:13px 20px; font-size:.95rem; box-shadow:0 12px 30px -14px rgba(120,60,10,.4)}

  /* editor */
  .editor{position:fixed; inset:0; background:var(--bg); z-index:33; overflow:auto;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .editor h3{margin:2px 0 10px; font-size:1rem}
  .editor label{display:block; font-size:.78rem; color:var(--muted); font-weight:600; margin:12px 0 5px}
  .editor textarea{width:100%; min-height:84px; border:1px solid var(--line); border-radius:14px; background:var(--panel);
    color:var(--ink); padding:12px; font:inherit; font-size:.92rem; resize:vertical}
  .editor .hint{font-size:.72rem; color:var(--muted); margin-top:4px}
  .editor .row{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
  .editor .row .btn{flex:1; text-align:center}

  /* stats / results */
  .panel{position:fixed; inset:0; z-index:34; overflow:auto; background:var(--bg);
    padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .panel .wrap{max-width:520px; margin:0 auto}
  .rhead{font-size:1.05rem; font-weight:750; text-align:center}
  .rsub{color:var(--muted); font-size:.82rem; text-align:center}
  .rscore{font-size:2.6rem; font-weight:800; color:var(--accent-2); text-align:center; line-height:1.1; margin:12px 0 2px}
  .rrows{margin-top:16px}
  .rrow{display:flex; justify-content:space-between; gap:12px; padding:7px 0; font-size:.9rem; border-bottom:1px dashed var(--line)}
  .rrow:last-child{border-bottom:0}
  .rrow b{font-weight:700}
  .grid{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px}
  .chip{width:38px; height:38px; padding:0; border-radius:12px; font-size:.85rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; border:1px solid var(--line); background:var(--accent-soft); color:var(--muted)}
  .chip.c0{background:#fdecec; color:#c81e1e; border-color:#f0b4b4}
  .chip.c1{background:#fdf3e0; color:#b45309; border-color:#f3d18a}
  .chip.c2{background:#e8f0fe; color:#1d4ed8; border-color:#a9c7f5}
  .chip.c3{background:#e7f6f3; color:#0f766e; border-color:#9fd9cd}
  body.dark .chip.c0{background:#3a1414; color:#f8a0a0; border-color:#5a2222}
  body.dark .chip.c1{background:#3a2a10; color:#f3c98a; border-color:#5a4020}
  body.dark .chip.c2{background:#12213f; color:#9fc0ff; border-color:#27407a}
  body.dark .chip.c3{background:#0f2f2a; color:#8fd9cd; border-color:#1d5348}
  .legend{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:12px; font-size:.72rem; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:4px}
  .legend .dot{width:10px; height:10px; border-radius:3px; display:inline-block}
  .panel .closebar{display:flex; justify-content:center; margin-top:18px}

  /* confirm */
  .confirm{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.55); padding:20px}
  .confirm .box{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; max-width:340px; width:100%}
  .confirm .box p{margin:0 0 16px; font-size:.95rem; line-height:1.4}
  .confirm .box .row{display:flex; gap:10px}
  .confirm .box .btn{flex:1; text-align:center}

  /* landscape */
  @media (orientation:landscape) and (min-width:640px){
    main{grid-template-columns:auto minmax(0,1fr) auto;
      grid-template-rows:1fr auto auto auto;
      grid-template-areas:"left scene right" "flip flip flip" "rate rate rate" "intervals intervals intervals";
      column-gap:14px}
    .controls{display:contents}
    #prev{grid-area:left; align-self:center}
    #next{grid-area:right; align-self:center}
    #flip{grid-area:flip; justify-self:center}
    .card{max-width:760px}
    #editBtn{top:calc(64px + env(safe-area-inset-top,0px)); bottom:auto; left:14px}
  }
  @media(max-width:520px){
    .lead{font-size:1.16rem}
    .pts>li{font-size:1rem}
    .face{padding:30px 18px 20px}
  }
</style>
</head>
<body>
<header class="banner">
  <div class="head-top">
    <div class="topic">{{TOPIC}}</div>
    <button id="menuBtn" class="icon-btn" aria-label="Menu">&#9776;</button>
  </div>
  <div class="shuffle-row"><button id="shuffle" class="capsule">Shuffle: off</button><button id="tagBtn" class="capsule">Tag: —</button></div>
  <div class="tagbar" id="tagbar"></div>
  <div class="meta">{{DATE}} &middot; <span id="count">{{N}}</span> cards <span class="due" id="due"></span><span id="cloud" style="margin-left:8px;color:var(--accent-2);font-weight:700"></span></div>
  <div class="bar"><i id="prog"></i></div>
</header>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head"><span>Menu</span><button id="drawerClose" class="icon-btn" aria-label="Close">&#10005;</button></div>
  <button id="cardsBtn" class="btn">&#9776; Cards</button>
  <button id="statsBtn" class="btn">Stats</button>
  <button id="themeBtn" class="btn">Theme: Light</button>
  <button id="dueBtn" class="btn">Review due (0)</button>
  <button id="submitBtn" class="btn">Submit &amp; see results</button>
  <button id="againBtn" class="btn">Practice Again (0)</button>
  <button id="syncBtn" class="btn">Cloud sync</button>
</aside>

<main>
  <div class="scene">
    <div class="card" id="card">
      <div class="face front"><span class="tag">Question</span><span class="cardtag" id="chipF"></span><div class="inner" id="q"></div></div>
      <div class="face back"><span class="tag">Answer</span><span class="cardtag" id="chipB"></span><div class="inner"><div id="a"></div><div id="note"></div><div class="src" id="src"></div></div></div>
    </div>
  </div>
  <div class="controls">
    <button id="prev" class="btn">&#8592; Prev</button>
    <button id="flip" class="btn primary">Flip</button>
    <button id="next" class="btn">Next &#8594;</button>
  </div>
  <div class="rate hidden" id="rate">
    <button class="btn" data-r="0"><b>Again</b><small>&le;10%</small></button>
    <button class="btn" data-r="1"><b>Hard</b><small>upto 30%</small></button>
    <button class="btn" data-r="2"><b>Good</b><small>upto 60%</small></button>
    <button class="btn" data-r="3"><b>Easy</b><small>upto 90%</small></button>
  </div>
  <div class="intervals hidden" id="intervals"></div>
</main>

<button id="editBtn" class="btn">Edit</button>

<div class="sheet hidden" id="cardsheet">
  <div class="sheet-head"><span>&#9776; Cards</span><button id="sheetClose" class="icon-btn">&#10005;</button></div>
  <div class="list" id="cardList"></div>
  <div class="searchwrap"><input id="cardSearch" class="search" type="text" placeholder="Search cards…" autocomplete="off"></div>
</div>

<div class="editor hidden" id="editor">
  <h3>Edit card</h3>
  <label>Front</label>
  <textarea id="edFront"></textarea>
  <div id="edBackWrap"><label>Back</label><textarea id="edBack"></textarea></div>
  <label>My note</label>
  <textarea id="edNote" placeholder="Your own note for this card…"></textarea>
  <div class="hint">Formatting: a line starting with &bull; is a main point; a line starting with - is a sub-point.</div>
  <div class="row">
    <button id="edSave" class="btn primary">Save</button>
    <button id="edClose" class="btn">Close</button>
  </div>
  <div class="row">
    <button id="edReset" class="btn">Reset card</button>
    <button id="edDelete" class="btn">Delete card</button>
  </div>
  <div class="row">
    <button id="edBackup" class="btn">Backup notes</button>
    <button id="edRestore" class="btn">Restore notes</button>
  </div>
  <div class="row">
    <button id="edUndelete" class="btn">Restore deleted (0)</button>
  </div>
</div>

<div class="panel hidden" id="stats"></div>
<div class="panel hidden" id="results"></div>
<div class="confirm hidden" id="confirm"></div>

<script>
const CARDS = [
  /* FLASHCARD-DAILY:CARDS — replace this whole array with your card objects. See the flashcard-deck skill for the schema. */
];
const TOPIC = "{{TOPIC}}";
const SUBJECT = "{{SUBJECT}}";
const SET = parseInt("{{SET}}", 10) || 1;
const SETNAME = (SET === 1 ? 'Basics & Fundamentals' : SET === 2 ? 'Main Concepts & Depth' : SET === 3 ? 'Integrated & Complex' : '');
</script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var deck = CARDS.slice();
  var RK='fd:review:'+TOPIC, EK='fd:edits:'+TOPIC, DK='fd:deleted:'+TOPIC, TK='fd:theme';
  function ls(k,d){ try{ var v=localStorage.getItem(k); return v? JSON.parse(v): d; }catch(e){ return d; } }
  function ss(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var review = ls(RK, {}), edits = ls(EK, {}), deleted = ls(DK, []), theme = ls(TK, 'light');
  var UK = 'fd:cardu:' + TOPIC, cardU = ls(UK, {});

  var IV = {1:[[1,'Tomorrow'],[2,'2 days after'],[3,'3 days after']],
            2:[[7,'7 days after'],[10,'10 days after'],[15,'15 days after']],
            3:[[21,'21 days after'],[30,'30 days after'],[60,'60 days after'],[90,'90 days after']]};
  var RLABEL = ['Again','Hard','Good','Easy'];
  var TAGS = ['Basics&Fundamentals', 'MainConcepts', 'Integrated&Complex'];
  function tagOf(id){ var e = edits[id]; if(e && e.tag != null) return e.tag; var c = deckCard(id); return (c && c.tag) || ''; }
  function setTag(id, t){
    var e = edits[id] || {};
    if(t) e.tag = t; else delete e.tag;
    edits[id] = e; cardU[id] = Date.now(); ss(EK, edits); ss(UK, cardU);
    reapplyOrder(); renderTagUI(); syncPush(id);
  }

  function cid(i){ var c = deck[i] || {}; return c.id || ('c'+i); }
  function isDel(id){ return deleted.indexOf(id) >= 0; }
  function activeIndices(){ var a=[]; for(var i=0;i<deck.length;i++){ if(!isDel(cid(i))) a.push(i); } return a; }
  var order = activeIndices(), idx = 0;
  var tagFilter = '';
  function shuffleOrder(){ for(var i=order.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=order[i]; order[i]=order[j]; order[j]=t; } }
  function reapplyOrder(){
    order = activeIndices().filter(function(i){ return !tagFilter || tagOf(cid(i)) === tagFilter; });
    if(shuffled) shuffleOrder();
    idx = Math.min(idx, Math.max(0, order.length - 1));
  }
  function renderTagUI(){
    var t = tagOf(curId());
    var tb = $('tagBtn'); if(tb){ tb.textContent = t ? ('#' + t) : 'Tag: \u2014'; tb.classList.toggle('on', !!t); }
    var cf = $('chipF'), cb = $('chipB');
    if(cf) cf.textContent = t ? ('#' + t) : '';
    if(cb) cb.textContent = t ? ('#' + t) : '';
    var bar = $('tagbar'); if(!bar) return;
    bar.textContent = '';
    var counts = {}; TAGS.forEach(function(x){ counts[x] = 0; });
    var act = activeIndices();
    act.forEach(function(i){ var g = tagOf(cid(i)); if(g && counts[g] != null) counts[g]++; });
    var all = document.createElement('button'); all.className = 'tchip' + (tagFilter ? '' : ' on');

  function parseText(str){
    var lines=String(str||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
    if(lines.length<=1) return lines[0]||'';
    var lead=null, items=[];
    lines.forEach(function(l){
      if(l.charAt(0)==='\u2022'){ items.push({t:l.slice(1).trim(), sub:[]}); }
      else if(l.charAt(0)==='-'){ if(items.length) items[items.length-1].sub.push(l.slice(1).trim()); else items.push({t:l.slice(1).trim(), sub:[]}); }
      else { if(items.length===0 && lead===null) lead=l; else if(lead!==null) lead+=' '+l; else items.push({t:l, sub:[]}); }

  var uid = (session && session.user) ? session.user.id : null;
  var syncPanel = null;

  function sbHeaders(extra){
    var h = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
    if(session && session.access_token) h['Authorization'] = 'Bearer ' + session.access_token;
    if(extra) for(var k in extra) h[k] = extra[k];
    return h;
  }
  function sb(path, opts){
    opts = opts || {};
    opts.headers = sbHeaders(opts.headers);
    return fetch(SB_URL + path, opts).then(function(r){
      if(!r.ok) return r.text().then(function(t){ throw new Error(r.status + ' ' + t); });
      var ct = r.headers.get('content-type') || '';
      return ct.indexOf('json') >= 0 ? r.json() : r.text();
    });
  }
  function withExpiry(d){ if(d && d.expires_in) d.expires_at = Math.floor(Date.now()/1000) + d.expires_in; return d; }
  function saveSession(s){ session = s; ss('fd:auth', s); uid = (s && s.user) ? s.user.id : null; }
  function authToken(email, pw){
    return fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ 'apikey': SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email:email, password:pw })
    }).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error_description || d.msg || 'sign-in failed'); return withExpiry(d); }); })
      .then(function(d){ saveSession(d); return d; });
  }
  function ensureAuth(){
    if(!session) return Promise.reject(new Error('not signed in'));
    if(session.expires_at && (Date.now()/1000) < (session.expires_at - 60)) return Promise.resolve();
    if(!session.refresh_token) return Promise.reject(new Error('no refresh token'));
    return fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'apikey': SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    }).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error('refresh failed'); return withExpiry(d); }); })
      .then(function(d){ saveSession(d); });
  }
  function setCloud(t){
    var c = $('cloud'); if(c) c.textContent = t ? ('\u00b7 ' + t) : '';
    var b = $('syncBtn'); if(b) b.textContent = session ? 'Cloud sync (on)' : 'Cloud sync';
  }
  function rowFor(id){
    var st = review[id] || {}, e = edits[id] || {}, del = deleted.indexOf(id) >= 0;
    var has = (typeof st.r === 'number') || st.i != null || st.due != null || e.q != null || e.text != null || e.a != null || e.note != null || e.tag != null || del || (cardU[id] > 0);
    if(!has) return null;
    var u = cardU[id] || Date.now(); cardU[id] = u;
    var front = (e.q != null) ? e.q : (e.text != null ? e.text : null);
    return { user_id: uid, deck_key: DECKKEY, card_id: id,
      rating: (typeof st.r === 'number' ? st.r : null),
      interval_days: (st.i != null ? st.i : null),
      due_at: (st.due != null ? st.due : null),
      front_text: front, back_text: (e.a != null ? e.a : null), note: (e.note != null ? e.note : null),
      tag: (e.tag != null ? e.tag : null),
      deleted: del, updated_ms: u };
  }
  function syncPush(id){
    if(!session) return;
    var row = rowFor(id); ss(UK, cardU);
    if(!row) return;
    ensureAuth().then(function(){
      return sb('/rest/v1/deck_state?on_conflict=user_id,deck_key,card_id', { method:'POST', headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(row) });
    }).then(function(){ setCloud('synced'); }).catch(function(){ setCloud('sync error'); });
  }
  function syncPushAll(){
    if(!session) return;
    var rows = [];
    for(var i=0;i<deck.length;i++){ var r = rowFor(cid(i)); if(r) rows.push(r); }
    ss(UK, cardU);
    if(!rows.length) return;
    ensureAuth().then(function(){
      return sb('/rest/v1/deck_state?on_conflict=user_id,deck_key,card_id', { method:'POST', headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });
    }).then(function(){ setCloud('synced'); }).catch(function(){ setCloud('sync error'); });
  }
  function deckCard(id){ for(var i=0;i<deck.length;i++){ if(cid(i) === id) return deck[i]; } return null; }
  function applyRow(r){
    var id = r.card_id, u = r.updated_ms || 0;
    if(!(u > (cardU[id] || 0))) return;
    if(r.rating != null || r.interval_days != null || r.due_at != null){
      var st = review[id] || {};
      if(r.rating != null) st.r = r.rating;
      st.i = r.interval_days; st.due = r.due_at;
      review[id] = st;
    }
    if(r.front_text != null || r.back_text != null || r.note != null){
      var c = deckCard(id), type = (c && c.type) || 'qa', e = edits[id] || {};
      if(r.front_text != null){ if(type === 'cloze') e.text = r.front_text; else e.q = r.front_text; }
      if(r.back_text != null) e.a = r.back_text;
      if(r.note != null) e.note = r.note;
      if(r.tag != null) e.tag = r.tag;
      edits[id] = e;
    }
    if(r.deleted){ if(deleted.indexOf(id) < 0) deleted.push(id); }
    else { var k = deleted.indexOf(id); if(k >= 0) deleted.splice(k,1); }
    cardU[id] = u;
  }
  function syncPull(){
    if(!session) return;
    setCloud('syncing');
    ensureAuth().then(function(){
      return sb('/rest/v1/deck_state?select=*&deck_key=eq.' + encodeURIComponent(DECKKEY) + '&user_id=eq.' + uid);
    }).then(function(rows){
      if(Array.isArray(rows)){ rows.forEach(applyRow); ss(RK,review); ss(EK,edits); ss(DK,deleted); ss(UK,cardU); order = activeIndices(); idx = Math.min(idx, Math.max(0, order.length-1)); render(); }
      setCloud('synced'); syncPushAll();
    }).catch(function(){ setCloud('offline'); });
  }
  function syncContent(){
    if(!session) return;
    ensureAuth().then(function(){
      return sb('/rest/v1/decks?select=deck_key,html,filed&deck_key=eq.' + encodeURIComponent(DECKKEY) + '&user_id=eq.' + uid);
    }).then(function(rows){
      if(Array.isArray(rows) && rows.length && rows[0].filed === true && rows[0].html) return;
      var html = '<!DOCTYPE html>' + String.fromCharCode(10) + document.documentElement.outerHTML;
      if(!Array.isArray(rows) || !rows.length){
        return sb('/rest/v1/decks?on_conflict=user_id,deck_key', { method:'POST', headers:{ 'Prefer':'resolution=ignore-duplicates,return=minimal' }, body: JSON.stringify({ user_id: uid, deck_key: DECKKEY, topic: TOPIC, cards: deck, html: html, filed: false }) });
      }
      return sb('/rest/v1/decks?deck_key=eq.' + encodeURIComponent(DECKKEY) + '&user_id=eq.' + uid, { method:'PATCH', headers:{ 'Prefer':'return=minimal' }, body: JSON.stringify({ topic: TOPIC, cards: deck, html: html, updated_at: new Date().toISOString() }) });
    }).catch(function(){});
  }
  function mk(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function buildSyncUI(){
    var p = mk('div', 'panel hidden'); p.id = 'sync';
    var wrap = mk('div', 'wrap');
    wrap.appendChild(mk('div', 'rhead', 'Cloud sync'));
    var sub = mk('div', 'rsub', session ? ('Signed in as ' + ((session.user && session.user.email) || '')) : 'Sign in to sync your progress across all devices'); wrap.appendChild(sub);
    if(!session){
      var l1 = mk('label', null, 'Email'); l1.style.cssText = 'display:block;font-size:.78rem;color:var(--muted);font-weight:600;margin:14px 0 5px'; wrap.appendChild(l1);
      var em = document.createElement('input'); em.type='email'; em.id='syncEmail'; em.className='search'; em.placeholder='you@example.com'; em.autocomplete='username'; em.style.position='static'; wrap.appendChild(em);
      var l2 = mk('label', null, 'Password'); l2.style.cssText = l1.style.cssText; wrap.appendChild(l2);
      var pw = document.createElement('input'); pw.type='password'; pw.id='syncPass'; pw.className='search'; pw.placeholder='password'; pw.autocomplete='current-password'; pw.style.position='static'; wrap.appendChild(pw);
      var r1 = mk('div', 'row'); r1.style.cssText='display:flex;gap:8px;margin-top:16px';
      var si = mk('button', 'btn primary', 'Sign in'); si.onclick = doSignIn;
      var cu = mk('button', 'btn', 'Create account'); cu.onclick = doSignUp;
      r1.appendChild(si); r1.appendChild(cu); wrap.appendChild(r1);
    } else {
      var r2 = mk('div', 'row'); r2.style.cssText='display:flex;gap:8px;margin-top:16px';
      var sy = mk('button', 'btn primary', 'Sync now'); sy.onclick = function(){ syncPull(); syncContent(); };
      var so = mk('button', 'btn', 'Sign out'); so.onclick = function(){ saveSession(null); setCloud(''); if(syncPanel){ syncPanel.remove(); syncPanel = null; } openSync(); };
      r2.appendChild(sy); r2.appendChild(so); wrap.appendChild(r2);
      var r3 = mk('div', 'row'); r3.style.cssText='display:flex;gap:8px;margin-top:8px';
      var cp = mk('button', 'btn', 'Change password'); cp.onclick = changePassword;
      r3.appendChild(cp); wrap.appendChild(r3);
    }
    var cb = mk('div', 'closebar'); var b = mk('button', 'btn', 'Close'); b.onclick = function(){ p.classList.add('hidden'); }; cb.appendChild(b); wrap.appendChild(cb);
    p.appendChild(wrap); document.body.appendChild(p);
    return p;
  }
  function openSync(){
    if(syncPanel) syncPanel.remove();
    syncPanel = buildSyncUI();
    syncPanel.classList.remove('hidden');
  }
  function doSignIn(){
    var em = $('syncEmail').value.trim(), pw = $('syncPass').value;
    if(!em || !pw) return;
    var st = syncPanel.querySelector('.rsub'); if(st) st.textContent = 'Signing in';
    authToken(em, pw).then(function(){
      if(syncPanel) syncPanel.classList.add('hidden');
      setCloud('synced'); syncPull(); syncContent();
    }).catch(function(){ if(st) st.textContent = 'Sign-in failed - check your email and password.'; });
  }
  function doSignUp(){
    var em = $('syncEmail').value.trim(), pw = $('syncPass').value;
    if(!em || !pw) return;
    var st = syncPanel.querySelector('.rsub'); if(st) st.textContent = 'Creating account';
    fetch(SB_URL + '/auth/v1/signup', { method:'POST', headers:{ 'apikey': SB_KEY, 'Content-Type':'application/json' }, body: JSON.stringify({ email:em, password:pw }) })
      .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.msg || d.error_description || 'sign-up failed'); return withExpiry(d); }); })
      .then(function(d){ if(d.access_token){ saveSession(d); if(syncPanel) syncPanel.classList.add('hidden'); setCloud('synced'); syncPull(); syncContent(); } else if(st){ st.textContent = 'Account created - confirm via email, then Sign in.'; } })
      .catch(function(){ if(st) st.textContent = 'Sign-up failed.'; });
  }
  function changePassword(){
    if(!session) return;
    var n1 = window.prompt('New password (at least 8 characters):');
    if(n1 == null) return;
    if(n1.length < 8){ window.alert('Please use at least 8 characters.'); return; }
    var n2 = window.prompt('Type the new password again:');
    if(n2 !== n1){ window.alert('The two passwords do not match.'); return; }
    ensureAuth().then(function(){
      return fetch(SB_URL + '/auth/v1/user', { method:'PUT', headers:{ 'apikey': SB_KEY, 'Content-Type':'application/json', 'Authorization':'Bearer ' + session.access_token }, body: JSON.stringify({ password: n1 }) })
        .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.msg || d.error_description || 'failed'); return d; }); });
    }).then(function(){ window.alert('Password changed. Use the new one next time you sign in.'); })
      .catch(function(){ window.alert('Could not change the password. Please try again.'); });
  }
  $('syncBtn').onclick = function(e){ e.stopPropagation(); closeDrawer(); openSync(); };
  setCloud(session ? 'synced' : '');
  if(session){ syncPull(); syncContent(); }

  if(window.__FD_TAG__ && TAGS.indexOf(window.__FD_TAG__) >= 0){ tagFilter = window.__FD_TAG__; reapplyOrder(); idx = 0; }

  applyTheme();
  render();
})();
</script>
